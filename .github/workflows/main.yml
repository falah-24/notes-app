name: CI/CD Flask Notes App

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t notes-app .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Run dummy test
        run: echo "No test yet, implement pytest later"

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Install Bandit
        run: |
          pip install bandit
      - name: Run Bandit
        run: |
          bandit -r app.py -ll -ii

  dast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run -v $(pwd):/zap/wrk -t ghcr.io/zaproxy/zaproxy \
            zap-baseline.py -t http://your-staging-url.com -r zap-report.html

      - name: Upload ZAP DAST Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-dast-report
          path: zap-report.html

